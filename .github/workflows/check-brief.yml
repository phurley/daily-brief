name: Check brief
on:
  workflow_dispatch:
  push:
    paths:
      - '*.js'
      - '*.mjs'
      - '*.css'
      - '*.html'
      - 'scripts/**'
      - 'data-collect/**'
      - 'schemas/story-editorial.schema.json'
      - 'brief-preferences.json'
      - 'schemas/science-health.schema.json'
      - 'preferences.mjs'
      - 'DailyBriefWidgets/**'
      - 'DailyBriefTests/**'
      - 'package*.json'
      - '.github/workflows/check-brief.yml'
  pull_request:
permissions:
  contents: read
jobs:
  python:
    # Every Python unit test: collector, LLM client, science, reviews, deploy
    # guard and publishers. Fast; no browsers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-collect/requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r data-collect/requirements-test.txt
      - name: data-collect unit tests
        working-directory: data-collect
        run: SCIENCE_NODE=$(command -v node) python -m unittest discover -s . -p 'test_*.py'
      - name: Script tests
        run: for t in scripts/test_*.py; do echo "== $t"; python "$t" || exit 1; done
  web:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_MODULE: ${{ github.workspace }}/scripts/pinned-playwright.cjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Pin published data to the ci-browser-data snapshot
        # Today's published events/news must not decide whether a PR passes.
        run: echo "BRIEF_CLOCK=$(scripts/pin_browser_data.sh)" >> "$GITHUB_ENV"
      - run: npm run build:shell
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - name: Cached report upgrade checks
        run: |
          npm run test:caching
          BRIEF_BROWSER=webkit npm run test:caching
      - name: Browser checks
        run: |
          python3 -m http.server 4173 > /tmp/brief-preview.log 2>&1 &
          trap 'kill $!' EXIT
          npm run test:mobile
          BRIEF_BROWSER=webkit npm run test:mobile
          node scripts/featured-browser-check.cjs
          BRIEF_BROWSER=webkit node scripts/featured-browser-check.cjs
          npm run test:photos
          BRIEF_BROWSER=webkit npm run test:photos
          npm run test:themes
          BRIEF_BROWSER=webkit npm run test:themes
          npm run test:tuning
          BRIEF_BROWSER=webkit npm run test:tuning
          npm run test:integration
          BRIEF_BROWSER=webkit npm run test:integration
