name: Check brief
on:
  workflow_dispatch:
  push:
    paths:
      - '*.js'
      - '*.mjs'
      - '*.css'
      - '*.html'
      - 'scripts/**'
      - 'preferences.mjs'
      - 'DailyBriefWidgets/**'
      - 'DailyBriefTests/**'
      - 'package*.json'
      - '.github/workflows/check-brief.yml'
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:shell
      - run: npm test
      - run: python3 scripts/test_publish_brief.py
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser checks
        run: |
          python3 -m http.server 4173 > /tmp/brief-preview.log 2>&1 &
          trap 'kill $!' EXIT
          npm run test:mobile
          BRIEF_BROWSER=webkit npm run test:mobile
          npm run test:integration
          BRIEF_BROWSER=webkit npm run test:integration
