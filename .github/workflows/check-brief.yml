name: Check brief
on:
  workflow_dispatch:
  push:
    paths:
      - '*.js'
      - '*.mjs'
      - '*.css'
      - '*.html'
      - 'scripts/**'
      - 'data-collect/review_events.py'
      - 'data-collect/test_review_events.py'
      - 'preferences.mjs'
      - 'DailyBriefWidgets/**'
      - 'DailyBriefTests/**'
      - 'package*.json'
      - '.github/workflows/check-brief.yml'
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:shell
      - run: npm test
      - name: Featured editorial evidence regression checks
        run: |
          python3 -m pip install beautifulsoup4 python-dateutil
          cd data-collect
          python3 -m unittest test_review_events
      - name: Collector and publisher regression checks
        run: |
          python3 scripts/test_calendar_retry.py
          python3 scripts/test_starship_job_lock.py
          python3 scripts/test_publish_brief.py
          python3 scripts/test_update_photos.py
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser checks
        run: |
          python3 -m http.server 4173 > /tmp/brief-preview.log 2>&1 &
          trap 'kill $!' EXIT
          npm run test:mobile
          BRIEF_BROWSER=webkit npm run test:mobile
          node scripts/featured-browser-check.cjs
          BRIEF_BROWSER=webkit node scripts/featured-browser-check.cjs
          npm run test:photos
          BRIEF_BROWSER=webkit npm run test:photos
          npm run test:themes
          BRIEF_BROWSER=webkit npm run test:themes
          npm run test:tuning
          BRIEF_BROWSER=webkit npm run test:tuning
          npm run test:integration
          BRIEF_BROWSER=webkit npm run test:integration
