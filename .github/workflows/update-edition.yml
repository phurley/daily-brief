name: Roll current edition
on:
  schedule:
    - cron: "7 4,5 * * *" # Detroit midnight in EDT/EST; second run is harmless
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-brief
  cancel-in-progress: false
jobs:
  edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/publish_brief.py
