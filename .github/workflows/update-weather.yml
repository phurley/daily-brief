name: Update weather

on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours (offset from the top of the hour)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch weather
        run: python scripts/update_weather.py

      - name: Validate against schema
        run: |
          pip install --quiet check-jsonschema
          check-jsonschema --schemafile schemas/weather.schema.json weather.json

      - name: Commit and push if changed
        run: |
          if git diff --quiet weather.json; then
            echo "weather.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git commit -m "Update weather.json"
          git pull --rebase origin main
          git push
