name: Update weather

on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours (offset from the top of the hour)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-brief
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch weather
        run: python scripts/update_weather.py

      - name: Validate against schema
        run: |
          pip install --quiet check-jsonschema
          check-jsonschema --schemafile schemas/weather.schema.json weather.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish source and compact edition
        run: python scripts/publish_brief.py weather.json
