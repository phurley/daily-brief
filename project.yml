name: DailyBrief
options:
  bundleIdPrefix: com.phurley
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DailyBrief:
    type: application
    platform: iOS
    sources: [DailyBrief]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.phurley.dailybrief
        INFOPLIST_KEY_CFBundleDisplayName: Daily Brief
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
    dependencies:
      - target: DailyBriefWidgets
        embed: true
  DailyBriefWidgets:
    type: app-extension
    platform: iOS
    sources: [DailyBriefWidgets]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.phurley.dailybrief.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Daily Brief Widgets
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
